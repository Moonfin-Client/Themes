# Triggered by workflow_run so the token can write to the pull request. Theme
# submissions arrive from forks, where a pull_request run only ever gets a
# read-only token, so the comment has to be posted from a separate run in the base
# repo. This job never checks out the branch, it only reads the artifact the
# sandboxed validation run uploaded.

name: PR Comment

on:
  workflow_run:
    workflows: [Validate themes]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post validation results
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: Download validation results
        id: results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: validate-results
          path: validate-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A run that produced no artifact leaves nothing to read, which happens when a fork
      # pull request waits for approval or the build fails before the upload. Neither is
      # this workflow's doing, so it stops quietly instead of failing the pull request.
      - name: Post PR comment
        if: steps.results.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (name) => {
              try {
                return fs.readFileSync(`validate-results/${name}`, 'utf8');
              } catch {
                return null;
              }
            };

            const outcomes = JSON.parse(read('outcomes.json'));
            const prNumber = outcomes.pr_number;
            const sha = outcomes.sha;
            const themes = outcomes.themes;
            const index = outcomes.index;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`;
            const status = (r) => r === 'success' ? '✅ Passed' : '❌ Failed';

            const marker = '<!-- moonfin-theme-validation -->';
            const lines = [marker];

            if (themes === 'success' && index === 'success') {
              lines.push(
                '## ✅ Themes validated',
                '',
                'Every theme parses and `index.json` matches `themes/`.',
              );
            } else {
              lines.push(
                '## ❌ Validation failed',
                '',
                '| Check | Status |',
                '|---|---|',
                `| **Theme files** | ${status(themes)} |`,
                `| **index.json** | ${status(index)} |`,
              );

              if (themes !== 'success') {
                // One line per theme plus the errors under each failure, capped so a
                // very long log can't push the comment past GitHub's size limit.
                const log = (read('themes.log') || '').trim().slice(0, 8000);
                lines.push('', '### Theme errors', '', '```', log, '```');
              }

              // The manifest is only written once it rebuilds, so its absence means the
              // rebuild itself failed and the advice to regenerate would be misleading.
              const expected = read('expected-index.json');
              if (index !== 'success' && expected) {
                lines.push(
                  '',
                  '### index.json is out of date',
                  '',
                  '`index.json` is generated from the files in `themes/`, so a change to a theme has to bring the regenerated manifest with it.',
                  '',
                  'Run `node scripts/generate-index.mjs` from the repository root and commit the result. Without Node on hand, copy the block below over `index.json`.',
                  '',
                  '<details><summary>Expected index.json</summary>',
                  '',
                  '```json',
                  expected.trim(),
                  '```',
                  '',
                  '</details>',
                );
              } else if (index !== 'success') {
                lines.push(
                  '',
                  '### index.json could not be rebuilt',
                  '',
                  'The manifest is generated from the files in `themes/`, so this check can only run once the theme errors above are fixed.',
                );
              }
            }

            lines.push(
              '',
              '| Property | Value |',
              '|---|---|',
              `| **Commit** | \`${sha.substring(0, 7)}\` |`,
              `| **Workflow run** | [Validate themes #${context.payload.workflow_run.run_number}](${runUrl}) |`,
            );

            const body = lines.join('\n');

            // Paginated because the marker falls off the first page once a pull request
            // collects more than 30 comments, which would post a second comment instead
            // of updating the first.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
