name: Validate themes

# index.json can't be regenerated by a bot commit. The ruleset covers every branch
# and wants a pull request plus verified signatures, and a workflow push gives
# neither, so the regenerated manifest travels in the pull request instead and this
# job is what checks it. The results are handed to the PR Comment workflow so a
# contributor sees the fix on the pull request rather than in the run log.

on:
  pull_request:
    paths:
      - 'themes/**'
      - 'index.json'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'index.json'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both checks run even when the first one fails, so a pull request that has a
      # malformed theme and a stale manifest reports both at once instead of hiding
      # the second behind the first.
      - name: Validate all theme files
        id: themes
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-themes.mjs 2>&1 | tee themes.log

      - name: Check index.json matches themes/
        id: index
        continue-on-error: true
        run: |
          node scripts/generate-index.mjs
          if git diff --quiet -- index.json; then
            echo 'index.json is up to date.'
            exit 0
          fi
          cp index.json expected-index.json
          git --no-pager diff -- index.json
          exit 1

      - name: Collect results
        if: github.event_name == 'pull_request'
        run: |
          cat > outcomes.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "sha": "${{ github.event.pull_request.head.sha }}",
            "themes": "${{ steps.themes.outcome }}",
            "index": "${{ steps.index.outcome }}"
          }
          EOF

      # expected-index.json only exists when the manifest drifted, and the comment
      # workflow treats a missing file as nothing to report.
      - name: Upload validation results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: validate-results
          path: |
            outcomes.json
            themes.log
            expected-index.json
          if-no-files-found: ignore

      - name: Fail if either check failed
        if: steps.themes.outcome != 'success' || steps.index.outcome != 'success'
        run: exit 1
