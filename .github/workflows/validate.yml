name: Validate themes

# index.json can't be regenerated by a bot commit. The ruleset covers every branch
# and wants a pull request plus verified signatures, and a workflow push gives
# neither, so the regenerated manifest travels in the pull request instead and this
# job is what checks it.

on:
  pull_request:
    paths:
      - 'themes/**'
      - 'index.json'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'index.json'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate all theme files
        run: node scripts/validate-themes.mjs
      - name: Check index.json matches themes/
        run: |
          node scripts/generate-index.mjs
          if git diff --quiet -- index.json; then
            echo 'index.json is up to date.'
            exit 0
          fi
          {
            echo '### index.json is out of date'
            echo
            echo '`index.json` is generated from the files in `themes/`, so a change to a theme has to bring the regenerated manifest with it.'
            echo
            echo 'Run `node scripts/generate-index.mjs` and commit the result, or copy the file below over `index.json`.'
            echo
            echo '<details><summary>Expected index.json</summary>'
            echo
            echo '```json'
            cat index.json
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff -- index.json
          exit 1
